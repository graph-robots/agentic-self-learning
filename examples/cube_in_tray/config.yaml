# Self-learning on cube_in_tray. Run from the repository root:
#   ROBOSIMSTUDIO_REPO=/path/to/robosimstudio uv run asl-run --config examples/cube_in_tray/config.yaml
# configs/ holds one file per feedback condition and agent; each overlays this one.
name: cube_in_tray
task: cube_in_tray/base
task_root: tasks
instruction: pick up the red cube and put it in the tray
train_episodes: "0:6"
eval_episodes: "20:26"
tools: tools.json
out_root: ../../outputs
# Beside the run and the task: this example's directory (its README states the
# goal; policy/ is a solution) and the tests' recorded batch of it.
off_limits: [., ../../tests/fixtures]

agent:
  kind: claude_code
  model: claude-opus-5-5
  max_turns: 80

# The paper's reference condition: numbers and predicates, parts, per workflow step.
feedback:
  form: [state, relations]
  spatial: parts
  granularity: semantic

loop:
  iterations: 4
  eval_every: 2
  perfect_streak: 2
  max_usd: 15.0
  fix_rounds: 2

execution:
  device: cuda:0
  perception: oracle
  motion: osc
